<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porra Mundial 2026 - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col justify-center items-center p-4">

    <div class="w-full max-w-md bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-xl">
        <div class="flex items-center gap-2 justify-center mb-6">
            <i class="fa-solid fa-soccer-ball text-emerald-400 text-2xl"></i>
            <span class="text-xl font-black tracking-wider bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">PORRA MUNDIAL 2026</span>
        </div>

        <div class="flex justify-center gap-4 mb-8 border-b border-slate-700 pb-4">
            <button id="toggle-login" onclick="toggleAuthMode(true)" class="text-xl font-bold text-emerald-400 border-b-2 border-emerald-400 pb-2 px-2">Ingresar</button>
            <button id="toggle-register" onclick="toggleAuthMode(false)" class="text-xl font-bold text-slate-400 pb-2 px-2">Registrarse</button>
        </div>
        
        <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
            <div id="field-nickname" class="hidden">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Apodo (Nickname)</label>
                <input type="text" id="auth-nickname" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Correo Electrónico</label>
                <input type="email" id="auth-email" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Contraseña</label>
                <input type="password" id="auth-password" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
            </div>
            
            <div class="bg-amber-950/40 border border-amber-700/60 p-3 rounded-xl flex gap-3 text-amber-300 text-xs">
                <i class="fa-solid fa-triangle-exclamation text-base mt-0.5 flex-shrink-0"></i>
                <p><strong>Aviso importante:</strong> Por motivos de diseño de seguridad de este sistema, la contraseña <strong>no se puede ni cambiar ni recuperar</strong> bajo ningún término tras crear la cuenta.</p>
            </div>

            <button type="submit" id="auth-submit-btn" class="w-full bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 font-bold py-3 rounded-xl hover:opacity-90 transition mt-2">Entrar</button>
        </form>
    </div>

    <!-- LÓGICA FIREBASE DE AUTENTICACIÓN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAL1kyOtdo7M9sJSuZHi2dM_CxUEARSlDI",
            authDomain: "mundial-eeb29.firebaseapp.com",
            projectId: "mundial-eeb29",
            storageBucket: "mundial-eeb29.firebasestorage.app",
            messagingSenderId: "406509376337",
            appId: "1:406509376337:web:acd37572d1231e80f77970"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Si ya está logueado, mandarlo directo a la app sin pasar por el login
        onAuthStateChanged(auth, (user) => {
            if (user) { window.location.href = "app.html"; }
        });

        window.toggleAuthMode = function(isLogin) {
            const nickField = document.getElementById('field-nickname');
            const submitBtn = document.getElementById('auth-submit-btn');
            const btnLogin = document.getElementById('toggle-login');
            const btnRegister = document.getElementById('toggle-register');

            if(isLogin) {
                nickField.classList.add('hidden');
                submitBtn.innerText = "Entrar";
                btnLogin.className = "text-xl font-bold text-emerald-400 border-b-2 border-emerald-400 pb-2 px-2";
                btnRegister.className = "text-xl font-bold text-slate-400 pb-2 px-2";
            } else {
                nickField.classList.remove('hidden');
                submitBtn.innerText = "Crear Cuenta";
                btnRegister.className = "text-xl font-bold text-emerald-400 border-b-2 border-emerald-400 pb-2 px-2";
                btnLogin.className = "text-xl font-bold text-slate-400 pb-2 px-2";
            }
        };

        window.handleAuth = async function(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const nickname = document.getElementById('auth-nickname').value;
            const isLogin = document.getElementById('field-nickname').classList.contains('hidden');

            try {
                if(isLogin) {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    const res = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "users", res.user.uid), {
                        nickname: nickname || email.split('@')[0],
                        email: email,
                        points: 0,
                        isDisqualified: false
                    });
                    window.location.href = "app.html";
                }
            } catch (err) { 
                alert("Error de autenticación: " + err.message); 
            }
        };
    </script>
</body>
</html>

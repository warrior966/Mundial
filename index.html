<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porra Mundial 2026 - Acceso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Script Oficial de Google reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen flex flex-col justify-center items-center p-4">

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="bg-slate-800 p-6 sm:p-8 rounded-2xl border border-slate-700 w-full max-w-md shadow-2xl relative overflow-hidden">
        
        <!-- LOGO Y TITULO -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center bg-emerald-500/10 text-emerald-400 p-4 rounded-full mb-3 border border-emerald-500/20">
                <i class="fa-solid fa-soccer-ball text-4xl animate-bounce"></i>
            </div>
            <h1 class="text-2xl font-black tracking-wider bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">PORRA MUNDIAL 2026</h1>
            <p class="text-xs text-slate-400 mt-1">Compite, predice y gana el premio definitivo 🍬</p>
        </div>

        <!-- SELECTOR DE PESTAÑAS (LOGIN / REGISTRO) -->
        <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-700 mb-6">
            <button id="tab-login-btn" onclick="switchAuthTab('login')" class="flex-1 py-2 rounded-lg font-bold text-sm bg-emerald-500 text-slate-950 transition">
                Iniciar Sesión
            </button>
            <button id="tab-register-btn" onclick="switchAuthTab('register')" class="flex-1 py-2 rounded-lg font-bold text-sm text-slate-400 transition">
                Registrarse
            </button>
        </div>

        <!-- FORMULARIO -->
        <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Correo Electrónico</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" id="auth-email" required placeholder="tu@correo.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Contraseña</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="auth-password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <!-- CONTENEDOR DE RECAPTCHA (Siempre visible para ambos modos) -->
            <div id="recaptcha-container" class="flex justify-center py-2">
                <!-- Integración de tu clave pública de Google reCAPTCHA -->
                <div class="g-recaptcha" data-sitekey="6LePYBAtAAAAAAkiW75YpqNpOhM8PGQuX7fEEFTs" data-theme="dark"></div>
            </div>

            <!-- BOTÓN ACCIÓN -->
            <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 font-black py-3.5 rounded-xl hover:opacity-90 transition shadow-lg shadow-emerald-950/20 text-sm mt-2">
                <i class="fa-solid fa-right-to-bracket mr-1"></i> Entrar a la Porra
            </button>
        </form>

    </div>

    <!-- SCRIPT DE FIREBASE Y LÓGICA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Configuración de tu proyecto Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAL1kyOtdo7M9sJSuZHi2dM_CxUEARSlDI",
            authDomain: "mundial-eeb29.firebaseapp.com",
            projectId: "mundial-eeb29",
            storageBucket: "mundial-eeb29.firebasestorage.app",
            messagingSenderId: "406509376337",
            appId: "1:406509376337:web:acd37572d1231e80f77970"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentMode = 'login'; // Puede ser 'login' o 'register'

        // Redirigir automáticamente si el usuario ya está logueado
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "app.html";
            }
        });

        // Cambiar entre pestañas de Iniciar Sesión y Registrarse
        window.switchAuthTab = function(mode) {
            currentMode = mode;
            const loginBtn = document.getElementById('tab-login-btn');
            const registerBtn = document.getElementById('tab-register-btn');
            const submitBtn = document.getElementById('submit-btn');

            if (mode === 'login') {
                loginBtn.className = "flex-1 py-2 rounded-lg font-bold text-sm bg-emerald-500 text-slate-950 transition";
                registerBtn.className = "flex-1 py-2 rounded-lg font-bold text-sm text-slate-400 transition";
                submitBtn.innerHTML = `<i class="fa-solid fa-right-to-bracket mr-1"></i> Entrar a la Porra`;
            } else {
                registerBtn.className = "flex-1 py-2 rounded-lg font-bold text-sm bg-emerald-500 text-slate-950 transition";
                loginBtn.className = "flex-1 py-2 rounded-lg font-bold text-sm text-slate-400 transition";
                submitBtn.innerHTML = `<i class="fa-solid fa-user-plus mr-1"></i> Crear Cuenta Nueva`;
            }
        };

        // Manejar el envío del formulario (Login o Registro)
        window.handleAuth = async function(event) {
            event.preventDefault();

            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;

            // --- VALIDACIÓN OBLIGATORIA DEL RECAPTCHA EN AMBOS CASOS ---
            const recaptchaResponse = grecaptcha.getResponse();

            if (recaptchaResponse.length === 0) {
                alert("Por favor, demuestra que no eres un robot marcando la casilla de reCAPTCHA.");
                return;
            }

            if (currentMode === 'login') {
                // --- PROCESO DE INICIO DE SESIÓN ---
                try {
                    await signInWithEmailAndPassword(auth, email, password);
                    window.location.href = "app.html";
                } catch (error) {
                    alert("Error al entrar: " + getReadableError(error.code));
                    grecaptcha.reset(); // Reiniciar el captcha tras un error para mayor seguridad
                }
            } else {
                // --- PROCESO DE REGISTRO ---
                try {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    // Crear el perfil del usuario en Firestore si no existe
                    const uDocRef = doc(db, "users", user.uid);
                    await setDoc(uDocRef, {
                        nickname: email.split('@')[0],
                        email: email,
                        points: 0,
                        isDisqualified: false
                    });

                    window.location.href = "app.html";
                } catch (error) {
                    alert("Error al registrarse: " + getReadableError(error.code));
                    grecaptcha.reset(); // Reiniciar el captcha tras un error
                }
            }
        };

        // Traducir los errores típicos de Firebase a español amigable
        function getReadableError(code) {
            switch (code) {
                case 'auth/invalid-credential':
                    return "El correo o la contraseña son incorrectos.";
                case 'auth/email-already-in-use':
                    return "Este correo electrónico ya está registrado.";
                case 'auth/weak-password':
                    return "La contraseña debe tener al menos 6 caracteres.";
                case 'auth/invalid-email':
                    return "El formato del correo electrónico no es válido.";
                default:
                    return code;
            }
        }
    </script>
</body>
</html>
